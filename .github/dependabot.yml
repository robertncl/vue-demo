# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # @angular-devkit/build-angular (through at least 22.1.7) pins typescript
      # to ">=6.0 <6.1", and vue-tsc 3.3.11 throws ERR_PACKAGE_PATH_NOT_EXPORTED
      # against TS7's restructured ./lib/tsc export. Revisit when Angular supports 7.x.
      # See: https://github.com/robertncl/vue-demo/issues/74
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "@vitejs/plugin-vue*"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "@vitejs/plugin-vue*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action/init writes a config file stamped with its own version and
      # codeql-action/analyze refuses to read a config from a different version
      # ("Loaded a configuration file for version X, but running version Y").
      # init, analyze and upload-sarif must always bump together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      github-actions:
        patterns:
          - "*"

