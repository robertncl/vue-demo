# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # @angular-devkit/build-angular (through at least 22.1.7) pins typescript
      # to ">=6.0 <6.1", and vue-tsc 3.3.11 throws ERR_PACKAGE_PATH_NOT_EXPORTED
      # against TS7's restructured ./lib/tsc export. Revisit when Angular supports 7.x.
      # See: https://github.com/robertncl/vue-demo/issues/74
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

